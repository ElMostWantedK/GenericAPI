spring.application.name=main

# Throwaway PostgreSQL container started by Testcontainers (requires Docker)
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///genericapi_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-postgresql.yaml
spring.liquibase.drop-first=false

# LOGS para debug
logging.level.liquibase=INFO
logging.level.org.springframework.jdbc=INFO

app.security.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LXVzZWQtaW4tcHJvZHVjdGlvbiE=
app.security.jwt.expiration-minutes=60

app.google.oauth.client-id=test-client-id.apps.googleusercontent.com
app.google.oauth.client-secret=test-client-secret

app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
