spring.application.name=main

# Secrets come from environment variables or from the git-ignored .env file (see .env.example)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (DB_URL is optional, DB_USERNAME / DB_PASSWORD are required)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/genericapi}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-postgresql.yaml
spring.liquibase.drop-first=false

# LOGS para debug
logging.level.liquibase=DEBUG
logging.level.org.springframework.jdbc=DEBUG

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=60

app.google.oauth.client-id=${GOOGLE_CLIENT_ID}
app.google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}

app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
