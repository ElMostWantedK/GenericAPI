spring.application.name=main

spring.datasource.url=jdbc:sqlite:src/main/resources/db/local.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP configuration for SQLite
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false

# Disable read-only transaction optimization for SQLite
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=false

# LOGS para debug
logging.level.liquibase=DEBUG
logging.level.org.springframework.jdbc=DEBUG

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=60

app.google.oauth.client-id=${GOOGLE_CLIENT_ID}
app.google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}

app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
