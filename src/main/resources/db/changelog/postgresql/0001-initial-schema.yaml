databaseChangeLog:
  # Baseline PostgreSQL schema. Equivalent to the final state of the former SQLite changelogs (0001-0010).
  - changeSet:
      id: pg-0001-create-users
      author: system
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: 'USER'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: pg-0002-create-addresses
      author: system
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_address_user
                    references: users(id)
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address2
                  type: VARCHAR(255)
              - column:
                  name: area
                  type: VARCHAR(100)
              - column:
                  name: state
                  type: VARCHAR(100)
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: zip_code
                  type: VARCHAR(20)
              - column:
                  name: phone_number
                  type: VARCHAR(20)
              - column:
                  name: is_default
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_addresses_user
            tableName: addresses
            columns:
              - column:
                  name: user_id

  - changeSet:
      id: pg-0003-create-products
      author: system
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: TEXT
              - column:
                  name: fabric_details
                  type: TEXT
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: REAL
                  constraints:
                    nullable: false
              - column:
                  name: sizes
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP

  - changeSet:
      id: pg-0004-create-product-images
      author: system
      changes:
        - createTable:
            tableName: product_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_image_product
                    references: products(id)
              - column:
                  name: url
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_main
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_product_images_product
            tableName: product_images
            columns:
              - column:
                  name: product_id

  - changeSet:
      id: pg-0005-create-orders
      author: system
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: shipped_at
                  type: TIMESTAMP
              - column:
                  name: delivered_at
                  type: TIMESTAMP
              - column:
                  name: address_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_address
                    references: addresses(id)
        - createIndex:
            indexName: idx_orders_address
            tableName: orders
            columns:
              - column:
                  name: address_id

  - changeSet:
      id: pg-0006-create-order-products
      author: system
      changes:
        - createTable:
            tableName: order_products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_product_order
                    references: orders(id)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_product_product
                    references: products(id)
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: price_at_purchase
                  type: REAL
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_order_products_order
            tableName: order_products
            columns:
              - column:
                  name: order_id
        - createIndex:
            indexName: idx_order_products_product
            tableName: order_products
            columns:
              - column:
                  name: product_id

  - changeSet:
      id: pg-0007-create-collections
      author: system
      changes:
        - createTable:
            tableName: collections
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: parent_collection_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_collection_parent
                    references: collections(id)
        - createIndex:
            indexName: idx_collections_parent
            tableName: collections
            columns:
              - column:
                  name: parent_collection_id

  - changeSet:
      id: pg-0008-create-collection-products
      author: system
      changes:
        - createTable:
            tableName: collection_products
            columns:
              - column:
                  name: collection_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_collection_product_collection
                    references: collections(id)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_collection_product_product
                    references: products(id)
        - addPrimaryKey:
            tableName: collection_products
            columnNames: collection_id, product_id
            constraintName: pk_collection_products
        - createIndex:
            indexName: idx_collection_products_collection
            tableName: collection_products
            columns:
              - column:
                  name: collection_id
        - createIndex:
            indexName: idx_collection_products_product
            tableName: collection_products
            columns:
              - column:
                  name: product_id
